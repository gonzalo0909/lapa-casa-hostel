# lapa-casa-hostel/render.yaml — channelapartamentos
#
# Frontend solo — motor de reservas APARTAMENTOS.
# Backend compartido: https://lapa-casa-hostel-api.onrender.com
# (gestionado desde la rama channelbackend — NO desplegar backend desde aquí)

services:
  # Landing estática — info de contacto + links a OTAs
  - type: web
    name: lapa-casa-hostel-landing-apartamentos
    env: static
    rootDir: public/landing
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    autoDeploy: true

  # Frontend Next.js — motor de reservas APARTAMENTOS (10 unidades, precio por noche)
  # Conectado al backend compartido (channelbackend) en Render.
  - type: web
    name: lapa-casa-hostel-frontend-apartamentos
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_SITE_URL
        value: https://lapa-casa-hostel-frontend-apartamentos.onrender.com
      # Backend compartido — mismo API para hostel Y apartamentos.
      # Stripe/MercadoPago/PIX configurados en el backend (channelbackend).
      - key: NEXT_PUBLIC_API_URL
        value: https://lapa-casa-hostel-api.onrender.com/api/v1
      # Claves públicas de los procesadores de pago (publishable/safe para el cliente)
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_MP_PUBLIC_KEY
        sync: false
    autoDeploy: true
